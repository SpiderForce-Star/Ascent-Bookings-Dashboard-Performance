name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Requires repo secrets (add once in GitHub → Settings → Secrets):
#   VERCEL_TOKEN          from https://vercel.com/account/tokens
#   VERCEL_ORG_ID         from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID     from .vercel/project.json after `vercel link`
#
# Or skip this workflow and use one-click import:
# https://vercel.com/new/clone?repository-url=https://github.com/SpiderForce-Star/Ascent-Bookings-Dashboard-Performance

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel env
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_AUTH_ENABLED: "false"

      - name: Deploy prebuilt
        id: deploy
        run: |
          url=$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
